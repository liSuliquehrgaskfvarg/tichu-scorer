<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tichu 計分器</title>
<script>try{var t=localStorage.getItem('tichu-scorer-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
  --bg:#eceff3;--surface:#ffffff;--ink:#14181f;--muted:#5b6472;--line:#d5dae1;
  --a:#2155d6;--a-tint:#e3ebfc;--b:#b91c1c;--b-tint:#fee2e2;
  --ok:#11794a;--ok-tint:#dcf3e7;--bad:#4b5563;--bad-tint:#e5e7eb;
  --on:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217;--surface:#181c23;--ink:#eef1f5;--muted:#9aa4b2;--line:#2c333d;
    --a:#7aa2ff;--a-tint:#17233f;--b:#f87171;--b-tint:#3a1717;
    --ok:#4cc38a;--ok-tint:#12301f;--bad:#9ca3af;--bad-tint:#2a2f37;
    --on:#0f1217;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217;--surface:#181c23;--ink:#eef1f5;--muted:#9aa4b2;--line:#2c333d;
  --a:#7aa2ff;--a-tint:#17233f;--b:#f87171;--b-tint:#3a1717;
  --ok:#4cc38a;--ok-tint:#12301f;--bad:#9ca3af;--bad-tint:#2a2f37;
  --on:#0f1217;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 6px;margin-bottom:12px}
.goal{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:5px;margin-left:auto}
.theme{font-size:14px;padding:0 7px;flex:none}
.goal select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;width:70px;padding:0 4px;text-align:center;text-align-last:center}
.tt .names{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;-webkit-overflow-scrolling:touch}
.ov main{padding-top:14px}
.ov h2{font-size:18px;margin:4px 0 14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .cap{font-size:15px;margin-bottom:8px}
.cols input{margin-bottom:8px;font-size:16px}
.ovacts{display:flex;gap:10px;margin-top:10px}
.ovacts button{flex:1;min-height:48px}
.ovacts .ok2{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.lock{overflow:hidden}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  min-height:44px;padding:0 10px;width:100%}
input:disabled{opacity:.4}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  min-height:44px;padding:0 10px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.3;cursor:not-allowed}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.totals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.tt{border-radius:14px;padding:12px 14px}
.tt.A{background:var(--a-tint);color:var(--a)}
.tt.B{background:var(--b-tint);color:var(--b)}
.tt .nm{font-size:14px;font-weight:600}
.tt .sc{font-size:48px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tt .gap{font-size:13px;opacity:.85}
.win{margin:-2px 0 12px;padding:10px 14px;border-radius:12px;background:var(--ok-tint);color:var(--ok);font-weight:600;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted);margin:12px 0 6px}
.lbl:first-of-type{margin-top:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap{font-size:13px;font-weight:600;margin-bottom:4px}
.cap.A{color:var(--a)}.cap.B{color:var(--b)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.tA button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:var(--on)}
.seg.tB button[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:var(--on)}
.seg button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on)}
.seg button.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on)}
.call{display:flex;flex-direction:column;gap:6px}
.sum{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.sum b{font-variant-numeric:tabular-nums;font-size:18px}
.err{color:var(--bad);font-size:14px;min-height:21px;margin-bottom:6px}
.go{width:100%;background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;font-size:17px;min-height:52px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .r1{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.hist .r2{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd span{font-size:13px;color:var(--muted)}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv{display:block;width:100%;border-radius:10px;padding:6px 10px;text-align:center;border:3px solid transparent;min-height:0}
.pv.A{background:var(--a-tint);color:var(--a)}
.pv.B{background:var(--b-tint);color:var(--b)}
.pv.A[aria-pressed="true"]{border-color:var(--a)}
.pv.B[aria-pressed="true"]{border-color:var(--b)}
.pv b{display:block;font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.pv small{font-size:12px;opacity:.85}
.pv:disabled{opacity:.5}
.adj{display:flex;align-items:center;gap:10px;margin-top:10px}
.rngw{flex:1;min-width:0}
input[type=range]{width:100%;min-height:44px;padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none;--th:var(--a);--p:50%}
input[type=range].B{--th:var(--b)}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;border:1px solid var(--th);
  background:linear-gradient(to right,var(--th) 0,var(--th) var(--p),var(--surface) var(--p),var(--surface) 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;border:1px solid var(--th);background:var(--surface)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--th)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--th);border:1px solid var(--th)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--th);border:1px solid var(--th)}
input[type=range]:disabled{opacity:.35}
.rng-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-6px}
.step{display:flex;flex-direction:column;gap:6px;flex:none}
.step button{width:56px;min-height:44px;font-size:24px;font-weight:600;line-height:1;padding:0}
.step.A button{color:var(--a);border-color:var(--a)}
.step.B button{color:var(--b);border-color:var(--b)}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Tichu 計分器</h1>
    <div class="top-r">
      <button type="button" class="theme" id="theme">深色</button>
      <button type="button" class="theme" id="edit">編輯</button>
      <label class="goal">目標分數 <select id="goal" aria-label="目標分數"></select></label>
    </div>
  </div>

  <section class="totals" aria-label="總分">
    <div class="tt A"><div class="nm">A 隊</div><div class="names" id="na" hidden></div><div class="sc" id="ta">0</div><div class="gap" id="ga"></div></div>
    <div class="tt B"><div class="nm">B 隊</div><div class="names" id="nb" hidden></div><div class="sc" id="tb">0</div><div class="gap" id="gb"></div></div>
  </section>
  <div class="win" id="win" hidden></div>

  <section class="panel">
    <h2>本局</h2>
    <div class="lbl">牌面分（點隊伍切換，另一隊自動補到 200）</div>
    <div class="pts">
      <button type="button" class="pv A" id="pvA"><small id="la">A 隊</small><b id="va">100</b></button>
      <button type="button" class="pv B" id="pvB"><small id="lb">B 隊</small><b id="vb">100</b></button>
    </div>
    <div class="adj">
      <div class="rngw">
        <input id="rng" type="range" min="-25" max="225" step="5" aria-label="牌面分滑桿">
        <div class="rng-ends"><span>−25</span><span>100</span><span>225</span></div>
      </div>
      <div class="step" id="step">
        <button type="button" id="plus" aria-label="加 5 分">+</button>
        <button type="button" id="minus" aria-label="減 5 分">−</button>
      </div>
    </div>

    <div class="lbl">Win-Win（同隊 1-2-3 名，該隊 +300）</div>
    <div class="seg" id="dbl"></div>

    <div class="lbl">地主</div>
    <div class="pair">
      <div class="call"><div class="cap A">A 隊</div><div class="seg tA" id="tA"></div><div class="seg" id="rA"></div></div>
      <div class="call"><div class="cap B">B 隊</div><div class="seg tB" id="tB"></div><div class="seg" id="rB"></div></div>
    </div>

    <div class="sum"><span>本局結算</span><b id="prev">A +0 ／ B +0</b></div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="commit">確定這局</button>
  </section>

  <section class="panel">
    <div class="hd"><h2>紀錄</h2><span id="cnt"></span></div>
    <ul class="hist" id="hist"></ul>
    <div class="acts">
      <button id="undo">撤銷上一局</button>
      <button id="reset">重新開始</button>
    </div>
  </section>
</main>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovt">
<main>
  <h2 id="ovt">編輯隊員</h2>
  <section class="panel">
    <div class="cols">
      <div><div class="cap A">A 隊</div>
        <input id="nA0" maxlength="12" placeholder="名字 1" aria-label="A 隊名字 1">
        <input id="nA1" maxlength="12" placeholder="名字 2" aria-label="A 隊名字 2">
        <input id="nA2" maxlength="12" placeholder="名字 3" aria-label="A 隊名字 3"></div>
      <div><div class="cap B">B 隊</div>
        <input id="nB0" maxlength="12" placeholder="名字 1" aria-label="B 隊名字 1">
        <input id="nB1" maxlength="12" placeholder="名字 2" aria-label="B 隊名字 2">
        <input id="nB2" maxlength="12" placeholder="名字 3" aria-label="B 隊名字 3"></div>
    </div>
    <div class="ovacts">
      <button type="button" id="nreset">全部重設</button>
      <button type="button" class="ok2" id="nok">確認</button>
    </div>
  </section>
</main>
</div>

<script>
(function(){
  var KEY='tichu-scorer-v1';
  var S={goal:1000,hist:[],names:{A:['','',''],B:['','','']}};
  var PMIN=-25,PMAX=225,PDEF=100;
  var GOALS=[500,600,700,800,900,1000];
  var cur=blank();
  var resetArmed=false,resetTimer=null;

  function blank(){return{dbl:'none',pa:PDEF,side:'A',A:{t:0,r:0},B:{t:0,r:0}};}
  function $(id){return document.getElementById(id);}
  function other(k){return k==='A'?'B':'A';}
  function fmt(x){return(x>=0?'+':'')+x;}
  function parse(v){
    if(v===''||v==null)return NaN;
    var n=Number(v);
    return (isFinite(n)&&Math.floor(n)===n)?n:NaN;
  }

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var d=JSON.parse(raw);
        if(d&&typeof d.goal==='number'&&d.goal>0)S.goal=d.goal;
        if(d&&Array.isArray(d.hist))S.hist=d.hist.filter(function(r){return r&&typeof r.a==='number'&&typeof r.b==='number';});
        if(d&&d.names)['A','B'].forEach(function(k){
          var arr=d.names[k];
          if(Array.isArray(arr))for(var i=0;i<3;i++)S.names[k][i]=typeof arr[i]==='string'?arr[i].slice(0,12):'';
        });
      }
    }catch(e){}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }

  function blocked(k){
    var o=other(k);
    return cur.dbl===o||(cur[o].t>0&&cur[o].r===1);
  }

  function setDbl(x){
    cur.dbl=x;
    if(x!=='none'){
      var o=other(x);
      if(cur[o].t>0&&cur[o].r===1)cur[o].r=2;
    }
    renderRound();
  }
  function setCall(k,t){
    cur[k].t=t;
    if(t===0)cur[k].r=0;
    renderRound();
  }
  function setResult(k,r){
    if(r===1&&blocked(k))return;
    cur[k].r=r;
    renderRound();
  }

  function makeSeg(el,items,onPick){
    el.innerHTML='';
    items.forEach(function(it){
      var b=document.createElement('button');
      b.type='button';
      b.textContent=it.label;
      b.setAttribute('aria-pressed',it.on?'true':'false');
      if(it.cls)b.className=it.cls;
      if(it.disabled)b.disabled=true;
      b.addEventListener('click',function(){onPick(it.value);});
      el.appendChild(b);
    });
  }

  function calc(){
    var a,b,notes=[],err='';
    if(cur.dbl==='A'){a=300;b=0;}
    else if(cur.dbl==='B'){a=0;b=300;}
    else{a=cur.pa;b=200-cur.pa;}
    if(cur.dbl!=='none')notes.push(cur.dbl+' 隊 Win-Win');
    ['A','B'].forEach(function(k){
      var c=cur[k];
      if(c.t>0){
        if(c.r===0){if(!err)err=k+' 隊地主請選成功或失敗';return;}
        var v=(c.t===1?100:200)*(c.r===1?1:-1);
        if(k==='A')a+=v;else b+=v;
        notes.push(k+' 隊'+(c.t===1?'小':'大')+'地主'+(c.r===1?'成功':'失敗'));
      }
    });
    return{a:a,b:b,notes:notes.join('、'),err:err};
  }

  function renderRound(){
    makeSeg($('dbl'),[
      {label:'無',value:'none',on:cur.dbl==='none'},
      {label:'A Win-Win',value:'A',on:cur.dbl==='A'},
      {label:'B Win-Win',value:'B',on:cur.dbl==='B'}
    ],setDbl);
    var dis=cur.dbl!=='none';
    renderPts();
    ['A','B'].forEach(function(k){
      var c=cur[k];
      makeSeg($('t'+k),[
        {label:'無',value:0,on:c.t===0},
        {label:'小',value:1,on:c.t===1},
        {label:'大',value:2,on:c.t===2}
      ],function(v){setCall(k,v);});
      var rEl=$('r'+k);
      if(c.t>0){
        rEl.style.display='';
        makeSeg(rEl,[
          {label:'成功',value:1,on:c.r===1,cls:'ok',disabled:blocked(k)},
          {label:'失敗',value:2,on:c.r===2,cls:'bad'}
        ],function(v){setResult(k,v);});
      }else{
        rEl.style.display='none';rEl.innerHTML='';
      }
    });
    updatePreview();
  }

  function updatePreview(){
    var r=calc();
    $('prev').textContent='A '+fmt(r.a)+' ／ B '+fmt(r.b);
    if($('err').textContent&&!r.err)$('err').textContent='';
  }

  function totals(){
    var ta=0,tb=0;
    S.hist.forEach(function(r){ta+=r.a;tb+=r.b;});
    return{a:ta,b:tb};
  }

  function renderTotals(){
    var t=totals();
    $('ta').textContent=t.a;$('tb').textContent=t.b;
    $('ga').textContent=t.a>=S.goal?'已達標':'還差 '+(S.goal-t.a);
    $('gb').textContent=t.b>=S.goal?'已達標':'還差 '+(S.goal-t.b);
    var w=$('win');
    if(t.a>=S.goal||t.b>=S.goal){
      w.hidden=false;
      if(t.a>t.b)w.textContent='A 隊獲勝'+withNames('A');
      else if(t.b>t.a)w.textContent='B 隊獲勝'+withNames('B');
      else w.textContent='雙方同分，再打一局';
    }else{w.hidden=true;w.textContent='';}
  }

  function renderHist(){
    var el=$('hist');
    el.innerHTML='';
    if(!S.hist.length){
      var li=document.createElement('li');li.className='empty';li.textContent='還沒有紀錄，打完一局後按「確定這局」。';
      el.appendChild(li);
    }else{
      var ta=0,tb=0,rows=[];
      S.hist.forEach(function(r,i){
        ta+=r.a;tb+=r.b;
        rows.push({i:i,r:r,ta:ta,tb:tb});
      });
      rows.reverse().forEach(function(x){
        var li=document.createElement('li');
        var l1=document.createElement('div');l1.className='r1';
        var s1=document.createElement('span');s1.textContent='第 '+(x.i+1)+' 局　'+x.r.a+' : '+x.r.b;
        var s2=document.createElement('span');s2.textContent='累計 '+x.ta+' : '+x.tb;
        l1.appendChild(s1);l1.appendChild(s2);li.appendChild(l1);
        if(x.r.n){var l2=document.createElement('div');l2.className='r2';l2.textContent=x.r.n;li.appendChild(l2);}
        el.appendChild(li);
      });
    }
    $('cnt').textContent=S.hist.length?'共 '+S.hist.length+' 局':'';
    $('undo').disabled=!S.hist.length;
    $('reset').disabled=!S.hist.length;
  }

  function renderAll(){renderTotals();renderHist();renderRound();}

  function sideVal(){return cur.side==='A'?cur.pa:200-cur.pa;}
  function renderPts(){
    var dis=cur.dbl!=='none',s=cur.side,v=sideVal();
    var rng=$('rng');
    rng.value=String(v);
    rng.style.setProperty('--p',((v-PMIN)/(PMAX-PMIN)*100)+'%');
    rng.className=s;
    rng.disabled=dis;
    rng.setAttribute('aria-label',s+' 隊牌面分滑桿');
    $('step').className='step '+s;
    $('plus').disabled=dis||v>=PMAX;
    $('minus').disabled=dis||v<=PMIN;
    $('va').textContent=dis?'—':cur.pa;
    $('vb').textContent=dis?'—':(200-cur.pa);
    $('la').textContent=s==='A'?'A 隊':'A 隊（自動）';
    $('lb').textContent=s==='B'?'B 隊':'B 隊（自動）';
    $('pvA').setAttribute('aria-pressed',s==='A'?'true':'false');
    $('pvB').setAttribute('aria-pressed',s==='B'?'true':'false');
    $('pvA').disabled=dis;$('pvB').disabled=dis;
  }
  function setPts(v){
    v=parse(v);
    if(isNaN(v))return;
    v=Math.max(PMIN,Math.min(PMAX,Math.round(v/5)*5));
    cur.pa=cur.side==='A'?v:200-v;
    renderPts();
    updatePreview();
  }
  function setSide(s){
    if(cur.dbl!=='none')return;
    cur.side=s;
    renderPts();
  }

  function commit(){
    var r=calc();
    if(r.err){$('err').textContent=r.err;return;}
    $('err').textContent='';
    S.hist.push({a:r.a,b:r.b,n:r.notes});
    save();
    cur=blank();
    renderAll();
  }

  function undo(){
    if(!S.hist.length)return;
    S.hist.pop();save();renderAll();
  }

  function disarmReset(){
    resetArmed=false;clearTimeout(resetTimer);
    $('reset').textContent='重新開始';
  }
  function reset(){
    if(!resetArmed){
      resetArmed=true;
      $('reset').textContent='再按一次清空';
      resetTimer=setTimeout(disarmReset,3000);
      return;
    }
    disarmReset();
    S.hist=[];save();
    cur=blank();
    $('err').textContent='';
    renderAll();
  }

  $('rng').addEventListener('input',function(){setPts(this.value);});
  $('plus').addEventListener('click',function(){setPts(sideVal()+5);});
  $('minus').addEventListener('click',function(){setPts(sideVal()-5);});
  $('pvA').addEventListener('click',function(){setSide('A');});
  $('pvB').addEventListener('click',function(){setSide('B');});
  $('commit').addEventListener('click',commit);
  $('undo').addEventListener('click',undo);
  $('reset').addEventListener('click',reset);
  var TKEY='tichu-scorer-theme';
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function getTheme(){try{var t=localStorage.getItem(TKEY);return(t==='light'||t==='dark')?t:'';}catch(e){return'';}}
  function isDark(){var t=getTheme();return t?t==='dark':!!(mq&&mq.matches);}
  function applyTheme(){
    var t=getTheme();
    if(t)document.documentElement.setAttribute('data-theme',t);
    else document.documentElement.removeAttribute('data-theme');
    var d=isDark();
    $('theme').textContent=d?'淺色':'深色';
    $('theme').setAttribute('aria-label',d?'切換成淺色':'切換成深色');
  }
  $('theme').addEventListener('click',function(){
    var next=isDark()?'light':'dark';
    try{localStorage.setItem(TKEY,next);}catch(e){}
    document.documentElement.setAttribute('data-theme',next);
    applyTheme();
  });
  if(mq){if(mq.addEventListener)mq.addEventListener('change',applyTheme);else if(mq.addListener)mq.addListener(applyTheme);}
  applyTheme();

  function snapGoal(v){
    var best=GOALS[GOALS.length-1];
    GOALS.forEach(function(g){if(Math.abs(g-v)<=Math.abs(best-v))best=g;});
    return best;
  }
  GOALS.forEach(function(g){
    var o=document.createElement('option');
    o.value=String(g);o.textContent=String(g);
    $('goal').appendChild(o);
  });
  $('goal').addEventListener('change',function(){
    var v=parse($('goal').value);
    if(GOALS.indexOf(v)>=0){S.goal=v;save();renderTotals();}
  });

  function nameList(k){return S.names[k].map(function(x){return x.trim();}).filter(function(x){return x;});}
  function withNames(k){var l=nameList(k);return l.length?'（'+l.join('、')+'）':'';}
  function renderNames(){
    ['A','B'].forEach(function(k){
      var el=$(k==='A'?'na':'nb'),l=nameList(k);
      el.textContent=l.join('、');
      el.hidden=!l.length;
    });
  }
  function openEdit(){
    ['A','B'].forEach(function(k){for(var i=0;i<3;i++)$('n'+k+i).value=S.names[k][i];});
    $('ov').hidden=false;document.body.classList.add('lock');
  }
  function closeEdit(){
    ['A','B'].forEach(function(k){for(var i=0;i<3;i++)S.names[k][i]=$('n'+k+i).value.trim().slice(0,12);});
    save();
    $('ov').hidden=true;document.body.classList.remove('lock');
    renderNames();renderTotals();
    $('edit').focus();
  }
  var nrArmed=false,nrTimer=null;
  function nrDisarm(){nrArmed=false;clearTimeout(nrTimer);$('nreset').textContent='全部重設';}
  $('edit').addEventListener('click',openEdit);
  $('nok').addEventListener('click',function(){nrDisarm();closeEdit();});
  $('nreset').addEventListener('click',function(){
    if(!nrArmed){nrArmed=true;$('nreset').textContent='再按一次清空';nrTimer=setTimeout(nrDisarm,3000);return;}
    nrDisarm();
    ['A','B'].forEach(function(k){for(var i=0;i<3;i++)$('n'+k+i).value='';});
  });

  load();
  renderNames();
  S.goal=snapGoal(S.goal);
  $('goal').value=String(S.goal);
  renderAll();
})();
</script>
</body>
</html>
